<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="screen.css" />
    <style>
      .value .cut,
      .tile .cut {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="intro">
      <p class="cut">Maintenance pauses every board of the app while its words list is rebuilt</p>
    </div>
    <div class="aside">
      <p class="cut">Weekly puzzles wait for the editors to sign the new words list off</p>
    </div>
    <div class="list" id="apps"></div>
    <div class="list" id="boards"></div>
    <div class="tiles"></div>
    <div id="tip" role="tooltip" hidden></div>
    <script src="cut-cards.js"></script>
  </body>
</html>
