[package]
name = "symphonyscript-evolve"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
allocation-counter = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonyscript = { path = "../../crates/compiler" }
symphonyscript-core = { path = "../../crates/core" }
symphonyscript-fixtures = { path = "../../crates/fixtures" }
unicode-normalization = "0.1"

[[bin]]
name = "evolve-check"
path = "src/bin/evolve_check.rs"

[[bin]]
name = "evolve-shrink"
path = "src/bin/evolve_shrink.rs"

[[bin]]
name = "evolve-mutants"
path = "src/bin/evolve_mutants.rs"

[[bin]]
name = "evolve-codes"
path = "src/bin/evolve_codes.rs"

[profile.dev]
opt-level = 1
